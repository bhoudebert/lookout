# Copy to lookout.yaml and edit. Secrets never go here: set LOOKOUT_LLM_API_KEY in the environment.

database: data/lookout.db

# Any OpenAI-compatible endpoint. Ollama is the default and costs nothing.
llm:
  base_url: http://localhost:11434/v1
  model: llama3.1
  daily_limit: 200

# Told to the model so scores reflect you.
interests: Backend engineering in Python, PostgreSQL, React, and the security of what I run.

# What an item IS. The model picks one. Edit to fit you.
kinds:
  [release, security, api-change, deprecation, announcement, schedule, tutorial, research, outage, discussion, other]

# The topics you look at ("Other" always exists). The description helps the model choose.
channels:
  - name: AI
    description: Models, agents, and the tooling around them
  - name: Languages
    description: Python, Rust and other languages I write
  - name: Security
    description: Vulnerabilities and fixes in what I run

# What you depend on: advisories and releases that mention these get rule-based priority floors.
stack:
  - name: django
    ecosystem: pypi
    version: "5.1.0" # optional; lets OSV return only what affects this version
  - name: postgresql
    aliases: [postgres]
  - name: react
    ecosystem: npm

sources:
  - name: python-insider
    type: rss
    url: https://pythoninsider.blogspot.com/feeds/posts/default
    channels: [Languages] # one channel: its items go straight there
  - name: lobsters
    type: rss
    url: https://lobste.rs/rss
    keywords: [python, postgres, rust, security]
    channels: [Languages, Security, AI, Other] # several: the model chooses


  # Releases, security advisories and (with access) Dependabot alerts of your repositories.
  # Uses your `gh` login if you have one, else LOOKOUT_GITHUB_TOKEN. Remove this block if you use neither.
  # - name: my-repos
  #   type: github
  #   repos: [owner/name]
  #   watch: [releases, advisories, dependabot]

