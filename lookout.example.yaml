# Copy to lookout.yaml and edit. Secrets never go here: set LOOKOUT_LLM_API_KEY in the environment.

database: data/lookout.db

# Any OpenAI-compatible endpoint. Ollama is the default and costs nothing.
llm:
  base_url: http://localhost:11434/v1
  model: llama3.1
  daily_limit: 200

# Told to the model so scores reflect you.
interests: Backend engineering in Python, PostgreSQL, React, and the security of what I run.

categories: [security, release, breaking-change, tooling, ai, industry, other]

# What you depend on: advisories and releases that mention these get rule-based priority floors.
stack:
  - name: django
    ecosystem: pypi
    version: "5.1.0" # optional; lets OSV return only what affects this version
  - name: postgresql
    aliases: [postgres]
  - name: react
    ecosystem: npm

sources:
  - name: python-insider
    kind: rss
    url: https://pythoninsider.blogspot.com/feeds/posts/default
  - name: lobsters
    kind: rss
    url: https://lobste.rs/rss
    keywords: [python, postgres, rust, security]

  # Releases, security advisories and (with access) Dependabot alerts of your repositories.
  # Uses your `gh` login if you have one, else LOOKOUT_GITHUB_TOKEN. Remove this block if you use neither.
  # - name: my-repos
  #   kind: github
  #   repos: [owner/name]
  #   kinds: [releases, advisories, dependabot]

  # Vulnerabilities for the packages in your stack, with CISA's "known exploited" flag.
  # - name: osv
  #   kind: osv
