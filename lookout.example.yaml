# Copy to lookout.yaml and edit. Secrets never go here: set LOOKOUT_LLM_API_KEY in the environment.

database: data/lookout.db

# Any OpenAI-compatible endpoint. Ollama is the default and costs nothing.
llm:
  base_url: http://localhost:11434/v1
  model: llama3.1
  daily_limit: 200

# Told to the model so scores reflect you.
interests: Backend engineering in Python, PostgreSQL, React, and the security of what I run.

# A bigger model for digests (the "Summarise these" button), if you have one. Optional; see the guide.
# digest:
#   model: gemma4-digest
#   max_items: 200

# The categories you look at, from broad to specific ("Dev > Rust" sits inside "Dev"). "Other" always exists.
# The description helps the model choose.
channels:
  - name: AI
    description: Models, agents, and the tooling around them
    icon: "🤖" # optional, one emoji; without it the local model suggests one
  - name: Dev > Python
    description: Python and its ecosystem
  - name: Dev > Rust
  - name: Security
    description: Vulnerabilities and fixes in what I run

# What you depend on: advisories and releases that mention these get rule-based priority floors.
stack:
  - name: django
    ecosystem: pypi
    version: "5.1.0" # optional; lets OSV return only what affects this version
  - name: postgresql
    aliases: [postgres]
  - name: react
    ecosystem: npm

# Sources and channels only seed the dashboard on the very first start; after that, manage them
# on its Sources page.
# How long things stay (see the guide, "Keeping the inbox small"). A source can set its own max_age_days.
retention:
  max_age_days: 30 # entries older than this are not stored; 0 keeps everything
  rules_window_days: 30 # an advisory older than this gets no rule floor
  expire_after_days: { p0: 0, p1: 30, p2: 14, p3: 7 } # untouched items move to Expired; 0 = never

sources:
  - name: python-insider
    type: rss
    url: https://pythoninsider.blogspot.com/feeds/posts/default
    channels: [Dev > Python] # one channel: its items go straight there
  - name: lobsters
    type: rss
    url: https://lobste.rs/rss
    keywords: [python, postgres, rust, security]
    channels: [Dev > Python, Security, AI, Other] # several: the model chooses


  # Releases, security advisories and (with access) Dependabot alerts of your repositories.
  # Uses your `gh` login if you have one, else LOOKOUT_GITHUB_TOKEN. Remove this block if you use neither.
  # - name: my-repos
  #   type: github
  #   repos: [owner/name]
  #   watch: [releases, advisories, dependabot]

