[project]
name = "lookout"
version = "0.0.0"
description = "Self-hosted watch tower for the feeds, releases and advisories that matter to your work"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
lookout = "lookout.adapters.cli.app:main"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["lookout"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RET", "RUF", "PL", "N", "ANN", "S", "T20", "TC"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR0913"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "lookout"

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "lookout.bootstrap",
    "lookout.adapters",
    "lookout.application",
    "lookout.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["lookout.domain"]
forbidden_modules = ["lookout.application", "lookout.adapters", "lookout.bootstrap"]

[[tool.importlinter.contracts]]
name = "Adapter families do not know each other"
type = "independence"
modules = [
    "lookout.adapters.cli",
]
