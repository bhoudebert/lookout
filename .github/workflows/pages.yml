name: Pages

# The website (site/) and the guide (docs/guide) are published together. The command reference is committed,
# and a test fails when it is stale, so this job needs no Python.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "package.json", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitepress build docs/guide
      - name: Assemble the site
        run: |
          mkdir -p _site/guide
          cp -r site/. _site/
          cp -r docs/guide/.vitepress/dist/. _site/guide/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
