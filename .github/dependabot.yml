version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "@tanstack/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "jsdom", "@playwright/*", "@axe-core/*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns:
          ["eslint*", "@eslint/*", "typescript*", "prettier", "@commitlint/*", "@playwright/*", "vitest", "@types/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
