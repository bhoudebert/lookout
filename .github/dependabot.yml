version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["eslint*", "@eslint/*", "typescript*", "prettier", "@commitlint/*", "@playwright/*", "vitest", "@types/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
